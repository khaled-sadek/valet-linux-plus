name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y network-manager libnss3-tools jq xsel
          composer install --no-interaction --prefer-dist
      - name: Test
        run: vendor/bin/phpunit
  cs_fixer:
    name: CS Fixer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y network-manager libnss3-tools jq xsel
          composer install --no-interaction --prefer-dist
      - name: CS Fixer
        run: vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php
